# Blueprint do Render — Mente Fria (US20). Conferido com https://render.com/docs/blueprint-spec em 26/10/2026.
# Cria: o backend (Docker, plano free) e o PostgreSQL 16 (plano free). O frontend vai para o GitHub Pages.
# ATENÇÃO (documentação do Render, 26/10/2026): o Postgres free EXPIRA 30 dias depois de criado;
# o serviço free desliga após 15 min sem uso e leva ~1 min para voltar.
services:
  - type: web
    name: mente-fria-backend
    runtime: docker
    plan: free
    region: virginia                 # a mais próxima do Brasil entre as 5; o banco tem de estar na MESMA região
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/saude
    envVars:
      - key: DB_HOST
        fromDatabase: { name: mente-fria-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: mente-fria-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: mente-fria-db, property: database }
      - key: DB_USER
        fromDatabase: { name: mente-fria-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: mente-fria-db, property: password }
      - key: JWT_SECRET
        generateValue: true            # 256 bits aleatórios em base64 (44 caracteres; o JwtService exige 32+)
      - key: CORS_ALLOWED_ORIGIN
        sync: false                    # o Render pergunta na criação. Ex.: https://kauencarneiro.github.io (sem barra no fim)
      # Licença WLS: hoje NÃO há (sem ela, o gurobipy usa a licença limitada do pip). Quando houver, crie no painel
      # GRB_WLSACCESSID, GRB_WLSSECRET e GRB_LICENSEID (decisões A11/A14). Nunca no Git.

databases:
  - name: mente-fria-db
    plan: free
    region: virginia
    databaseName: mente_fria
    postgresMajorVersion: "16"         # o mesmo do projeto (docker postgres:16 e Testcontainers)
