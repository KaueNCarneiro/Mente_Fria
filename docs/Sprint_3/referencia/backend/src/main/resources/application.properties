spring.application.name=backend
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mente_fria}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# No Render, a porta vem da variável PORT; localmente, 8080.
server.port=${PORT:8080}

# JSON em snake_case (Contrato §2, B6) para todos os records, na ida e na volta.
spring.jackson.property-naming-strategy=SNAKE_CASE

app.jwt.secret=${JWT_SECRET}
app.jwt.validade-horas=2
app.cors.allowed-origins=${CORS_ALLOWED_ORIGIN:http://127.0.0.1:5500,http://localhost:5500}
app.python.cmd=${PYTHON_CMD:python}
app.otimizador.script=${OTIMIZADOR_SCRIPT:../optimization/app/otimizador.py}
app.reposicao.script=${REPOSICAO_SCRIPT:../optimization/app/reposicao.py}
app.otimizador.timeout-segundos=${OTIMIZADOR_TIMEOUT_SEGUNDOS:10}
# Plano B da licença (A31): false no Render enquanto a Gurobi não autorizar; produção e reposição respondem 503.
app.otimizador.habilitado=${OTIMIZADOR_HABILITADO:true}
